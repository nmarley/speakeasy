[package]
name = "speakeasy-core"
version = "1.0.1"
edition = "2024"
authors = ["Nathan Marley <nathan@glowberrylabs.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "speakeasy_core"
crate-type = ["staticlib", "lib"]

[dependencies]
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.release]
lto = true
codegen-units = 1
