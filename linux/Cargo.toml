[package]
name = "speakeasy"
version = "1.1.0"
edition = "2024"
authors = ["Nathan Marley <nathan@glowberrylabs.com>"]
license = "MIT OR Apache-2.0"
description = "Linux Wayland client for Speakeasy local speech-to-text"

[[bin]]
name = "speakeasy"
path = "src/main.rs"

[dependencies]
speakeasy-core = { path = "../core" }
arboard = "3"
cpal = "0.15"
dirs = "6"
hound = "3.5"
ureq = "2"

[profile.release]
lto = true
codegen-units = 1
